---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: vfio_pci
---
apiVersion: v1alpha1
kind: UdevRulesConfig
rules:
  - SUBSYSTEM=="pci", DRIVERS=="xe", ATTRS{device}=="${device}", ATTR{sriov_numvfs}="${total_num}"
---
apiVersion: v1alpha1
kind: PCIDriverRebindConfig
name: 0000:00:0${pci_bus}.${vfio_pci_num}
targetDriver: vfio-pci
