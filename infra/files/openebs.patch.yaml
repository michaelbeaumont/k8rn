machine:
  kubelet:
    extraMounts:
      - destination: /var/local/openebs-openebs
        type: bind
        source: /var/local/openebs-openebs
        options:
          - bind
          - rshared
          - rw
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: openebs
volumeType: directory
