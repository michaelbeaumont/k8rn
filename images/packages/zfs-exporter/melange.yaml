package:
  name: zfs-exporter
  version: 2.4.2
  epoch: 0
  description: ZFS metrics exporter for Prometheus
  target-architecture:
    - x86_64
  copyright:
    - license: MIT

environment:
  contents:
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    packages:
      - bash
      - ca-certificates-bundle

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/pdf/zfs_exporter/releases/download/v${{package.version}}/zfs_exporter-${{package.version}}.linux-amd64.tar.gz
      expected-sha256: 6b6539e091b6fb1a4cf6cc74c501e793d21da50b1e1d7f7c4b7f837db136fa90
      delete: true
      strip-components: 1

  - runs: |
      install -Dm755 zfs_exporter "${{targets.destdir}}/usr/bin/zfs_exporter"
